<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0B2543; font-family: Aptos, Calibri, 'Segoe UI', sans-serif; position: relative; overflow: hidden; }
  .arco { position: absolute; border: 2px solid rgba(201, 173, 103, .55); border-radius: 50%; }
  .a1 { width: 520px; height: 520px; right: -200px; top: -240px; }
  .a2 { width: 380px; height: 380px; left: -190px; bottom: -210px; }
  .conteudo { position: absolute; left: 96px; top: 150px; right: 480px; }
  /* O arquivo do logotipo e quadrado com muita margem branca: recorte pelo cartao. */
  .logo { position: absolute; right: 96px; top: 190px; width: 340px; height: 220px; overflow: hidden; background: #F6F2E8; border: 1px solid #C9AD67; border-radius: 16px; }
  .logo img { width: 440px; display: block; margin: -66px 0 0 -52px; }
  .kicker { color: #C9AD67; letter-spacing: 4px; font-size: 20px; margin: 0 0 14px; }
  h1 { color: #fff; font-size: 88px; margin: 0; line-height: 1; }
  .sub { color: #D9C58D; font-size: 32px; line-height: 1.3; margin: 24px 0 0; }
  .tempo { color: #DDE6EF; font-size: 24px; margin: 18px 0 0; }
</style>
</head>
<body>
  <div class="arco a1"></div><div class="arco a2"></div>
  <div class="logo"><img src="../imagens/logotipo-del.png" alt=""></div>
  <div class="conteudo">
    <p class="kicker">DEL / LÓTUS</p>
    <h1>Mapa de Perfil.</h1>
    <p class="sub">Como você age. O que te move. O quanto o momento pesa.</p>
    <p class="tempo">Cerca de 16 minutos, direto no celular.</p>
  </div>
</body>
</html>
